name: Publier un APK Android
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - name: Vérifier la version et les cours
        run: |
          node scripts/check-release.mjs
          npm run courses:validate
          npm test
      - run: npm run android:sync
      - name: Préparer la clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure ANDROID_KEYSTORE_BASE64 avec la clé de signature durable."; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/memora-release.jks"
      - name: Compiler l’APK signé
        working-directory: android
        env:
          MEMORA_KEYSTORE: ${{ runner.temp }}/memora-release.jks
          MEMORA_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MEMORA_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MEMORA_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Préparer les fichiers de publication
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/memora.apk
          cp public/courses/catalog.json artifacts/catalog.json
          cd artifacts
          sha256sum memora.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: memora-android
          path: artifacts/
      - name: Publier la release GitHub
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/memora.apk artifacts/catalog.json artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "Mémora $GITHUB_REF_NAME"
      - name: Nettoyer la clé temporaire
        if: always()
        run: rm -f "$RUNNER_TEMP/memora-release.jks"
