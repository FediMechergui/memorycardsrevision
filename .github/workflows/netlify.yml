name: Déployer Mémora sur Netlify
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: netlify-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      NETLIFY_SITE_ID: 098b7143-679f-4534-994a-be5c8ca408b1
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run courses:validate && npm test && npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npx --yes netlify-cli@27.16.0 deploy --prod --no-build --message "Mémora ${{ github.sha }}"
